<!-- Single-Page App containing Home/Lobby, Game Canvas, and Game Over views -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Duel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <main id="app">
      <section id="home-view" aria-label="Home and lobby">
        <h1>Tank Duel</h1>

        <div id="auth-buttons">
          <button id="start-signin-button" type="button">Sign In</button>
          <button id="start-register-button" type="button">Register</button>
        </div>

        <form id="register-form" hidden>
          <h2>Register</h2>
          <input id="register-username" placeholder="Username" maxlength="10">
          <select id="register-avatar">
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
          </select>
          <input id="register-name" placeholder="Name" maxlength="16">
          <input id="register-password" type="password" placeholder="Password">
          <input id="register-confirm" type="password" placeholder="Confirm password">
          <button id="register-button" type="submit">Register</button>
          <button class="back-button" type="button">Back</button>
          <p id="register-message" class="message"></p>
        </form>

        <form id="signin-form" hidden>
          <h2>Sign In</h2>
          <input id="signin-username" placeholder="Username">
          <input id="signin-password" type="password" placeholder="Password">
          <button id="signin-button" type="submit">Sign In</button>
          <button class="back-button" type="button">Back</button>
          <p id="signin-message" class="message"></p>
        </form>

        <p id="signed-in-as">Not signed in.</p>
        <button id="signout-button" type="button" hidden>Sign Out</button>

        <div id="lobby-section" hidden>
          <button id="join-lobby-button" type="button">Join the lobby</button>
          <p id="lobby-message" class="message"></p>
          <p id="lobby-ready" hidden style="color:#22c55e;font-weight:bold;font-size:1.5rem">READY</p>
        </div>
      </section>

      <section id="game-view" aria-label="Game" hidden>
        <canvas id="game-canvas"></canvas>
      </section>

      <!--  Game Over View -->
      <section id="game-over-view" aria-label="Game over" hidden>
        <div class="io-gameover-backdrop">
          <div class="io-gameover-card">

            <!-- Top Outcome Ribbon & Match Conclusion -->
            <header class="io-header">
              <div id="go-outcome-pill" class="io-outcome-pill">MATCH COMPLETE</div>
              <h1 id="go-title" class="io-title">VICTORY!</h1>
              <p id="go-summary" class="io-subtitle">First to 3 Kills • 01:14</p>
            </header>

            <!-- 1v1 Head-to-Head Duel Scoreboard (Shell Shockers / Krunker style) -->
            <div id="go-versus-card" class="io-versus-card"></div>

            <!-- Personal Highlight KPI Tiles (Surviv.io style) -->
            <div id="go-kpi-grid" class="io-kpi-grid"></div>

            <!-- Two-Column Main Body: Left = Both Players' Match Stats | Right = Diep.io Ranking Bars -->
            <div class="io-panels-grid">

              <!-- Panel 1: Match Statistics for Both Players (10 Marks) -->
              <div class="io-panel">
                <div class="io-panel-header">
                  <span>⚔️ MATCH BREAKDOWN</span>
                  <span class="io-panel-tag">1v1 STATS</span>
                </div>
                <table class="io-stats-table">
                  <thead>
                    <tr>
                      <th>PLAYER</th>
                      <th>K / D</th>
                      <th>SHOTS</th>
                      <th>ACC</th>
                      <th>RICOCHET</th>
                      <th>ITEMS</th>
                    </tr>
                  </thead>
                  <tbody id="go-stats-tbody"></tbody>
                </table>
              </div>

              <!-- Panel 2: Diep.io Style Progress-Bar Leaderboard (10 Marks) -->
              <div class="io-panel">
                <div class="io-panel-header">
                  <span>🏆 TOP COMMANDERS</span>
                  <span class="io-panel-tag">GLOBAL RANK</span>
                </div>
                <div id="go-rank-list" class="io-rank-list"></div>
              </div>

            </div>

            <!-- 3. Arcade 3D Action Buttons: Restart & Back to Home (10 Marks) -->
            <p id="go-rematch-msg" class="io-rematch-msg"></p>
            <div class="io-actions">
              <button id="go-restart-btn" type="button" class="io-btn io-btn-primary">
                ▶ PLAY AGAIN
              </button>
              <button id="go-home-btn" type="button" class="io-btn io-btn-secondary">
                ⌂ HOME LOBBY
              </button>
            </div>

          </div>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/auth.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
